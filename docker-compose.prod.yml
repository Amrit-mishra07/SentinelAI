name: sentinelai-production

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the PostgreSQL service}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET}
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?Set SECRETS_ENCRYPTION_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the HTTPS frontend origin}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  MAX_AI_FINDINGS_PER_SCAN: ${MAX_AI_FINDINGS_PER_SCAN:-25}
  REPORTS_DIR: /reports
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipcsr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aipcsr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - reports:/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  worker:
    image: sentinelai-worker:local
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      SCANNER_SANDBOX: bwrap
      SCANNER_SERVICE_URL: http://scanner:9000
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?Set SCANNER_SERVICE_TOKEN}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-300}
      CLONE_TIMEOUT_SECONDS: ${CLONE_TIMEOUT_SECONDS:-120}
    networks: [default, scanning]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=768m,mode=1777"]
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    volumes:
      - reports:/reports
    depends_on:
      scanner:
        condition: service_healthy
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  scanner:
    image: sentinelai-worker:local
    command: ["/usr/local/bin/uvicorn", "scanner_service:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      SCANNER_SANDBOX: container
      SCANNER_SERVICE_PROCESS: "1"
      SCANNER_SERVICE_TOKEN: ${SCANNER_SERVICE_TOKEN:?Set SCANNER_SERVICE_TOKEN}
      SCANNER_TIMEOUT_SECONDS: ${SCANNER_TIMEOUT_SECONDS:-300}
    networks: [scanning]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=768m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  beat:
    image: sentinelai-worker:local
    command: ["/usr/local/bin/celery", "-A", "celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [api, web]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0 SIGTERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  reports:

networks:
  scanning:
    internal: true
