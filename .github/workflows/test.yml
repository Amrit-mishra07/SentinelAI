name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sentinel:test-only-password@127.0.0.1:5432/sentinel_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SCANNER_SANDBOX: process
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/aipcsr-api/requirements.txt
            apps/aipcsr-worker/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install -r apps/aipcsr-worker/requirements.txt
          python -m pip install pytest pytest-asyncio "httpx<0.28"
      - name: Install pinned scanner tooling for controlled fixtures
        run: |
          python -m venv .scanners
          .scanners/bin/pip install setuptools==80.10.2 bandit==1.9.4 semgrep==1.99.0
          sudo mkdir -p /opt/scanners
          sudo chown "$USER" /opt/scanners
          npm install --prefix /opt/scanners --save-exact eslint@9.39.4 @typescript-eslint/parser@8.46.2
          echo "/opt/scanners/node_modules/.bin" >> "$GITHUB_PATH"
      - name: PostgreSQL migration and complete backend test suite
        env:
          SKIP_FRONTEND: "1"
        run: PYTHON_BIN="$(command -v python)" PATH="$PWD/.scanners/bin:$PATH" bash run_ci_tests.sh
      - name: Verify migration is idempotent
        env:
          PYTHONPATH: apps/aipcsr-api:core/db-core
        run: python -m alembic -c core/db-core/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/aipcsr-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aipcsr-web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: "1"

  container-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images with the production filesystem layout
        run: |
          docker build -t sentinel-api:ci -f infrastructure/docker/Dockerfile.api .
          docker build -t sentinel-worker:ci -f infrastructure/docker/Dockerfile.worker .
          docker build -t sentinel-web:ci -f infrastructure/docker/Dockerfile.frontend .
      - name: Verify API and all worker task imports as nonroot
        run: |
          docker run --rm --entrypoint python sentinel-api:ci -c "import os; import app.main; assert os.getuid() == 10001"
          docker run --rm --entrypoint /usr/local/bin/python sentinel-worker:ci -c "import os; import celery_app; from tasks import scan_task, ai_analysis_task, report_task, patch_task, notification_task, integration_task; assert os.getuid() == 10001"
      - name: Verify scanners without credentials or network access
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=768m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --memory 4g --cpus 2 --pids-limit 128 -v "$PWD/infrastructure/ci-cd/scanner_probe.py:/probe.py:ro" --entrypoint /usr/local/bin/python sentinel-worker:ci /probe.py
      - name: Verify frontend starts from its production image
        run: |
          docker run -d --name sentinel-web-ci -p 127.0.0.1:3000:3000 sentinel-web:ci
          trap 'docker logs sentinel-web-ci; docker rm -f sentinel-web-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
